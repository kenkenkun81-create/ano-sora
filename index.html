```html
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>あの空へ〜青のジャンプ〜 パート練習</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#eef6ff;
  color:#172033;
}

header{
  text-align:center;
  background:white;
  padding:28px 15px;
  box-shadow:0 2px 10px #0001;
}

header h1{
  margin:0 0 8px;
  font-size:28px;
}

header div{
  color:#64748b;
}

main{
  max-width:900px;
  margin:auto;
  padding:25px 15px;
}

/* パート選択 */
.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.part{
  padding:30px 15px;
  border:0;
  border-radius:18px;
  background:white;
  font-size:22px;
  font-weight:bold;
  color:#172033;
  box-shadow:0 5px 20px #0002;
  cursor:pointer;
}

.part:active{
  transform:scale(.98);
}

/* 練習画面 */
#practice{
  display:none;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.top h2{
  margin:0;
}

.back{
  padding:10px 16px;
  border:0;
  border-radius:10px;
  background:white;
  font-size:16px;
  cursor:pointer;
}

audio{
  width:100%;
  margin:20px 0;
}

.status{
  background:white;
  border-radius:12px;
  padding:12px;
  margin-bottom:15px;
  text-align:center;
  color:#64748b;
}

.lyrics{
  height:60vh;
  overflow-y:auto;
  background:white;
  border-radius:18px;
  padding:25px;
  scroll-behavior:smooth;
}

.line{
  text-align:center;
  font-size:25px;
  line-height:1.8;
  padding:9px;
  color:#94a3b8;
}

.active{
  color:#111827;
  font-weight:bold;
  transform:scale(1.04);
}

@media(max-width:520px){
  .menu{
    grid-template-columns:1fr;
  }

  .lyrics{
    height:60vh;
  }

  header h1{
    font-size:23px;
  }
}
</style>
</head>

<body>

<header>
  <h1>あの空へ〜青のジャンプ〜</h1>
  <div>パート練習</div>
</header>

<main>

<!-- パート選択 -->
<section id="menu">

  <div class="menu">

    <button class="part" data-p="Soprano">
      ソプラノ
    </button>

    <button class="part" data-p="Alto">
      アルト
    </button>

    <button class="part" data-p="Tenor">
      テノール
    </button>

    <button class="part" data-p="Bass">
      ベース
    </button>

  </div>

</section>


<!-- 練習画面 -->
<section id="practice">

  <div class="top">
    <h2 id="title"></h2>
    <button class="back">← 戻る</button>
  </div>

  <div class="status" id="status">
    ▶️ 再生ボタンを押してください
  </div>

  <audio id="audio" controls preload="metadata"></audio>

  <div class="lyrics" id="lyrics"></div>

</section>

</main>


<script>

/* =========================
   歌詞
========================= */

const lyrics = [
"空をかける鳥たちも",
"最初からうまく飛べたわけじゃない",
"初めての自転車",
"笑っていた",
"体中きずだらけ",
"でも安全な道ってなに？ なに？",
"間違いのない生き方って何？ 何？",
"みんなが君の未来のためというけれど",
"僕の未来 本当にみえているの？",
"上と下 果てしなくちぎれていく世界",
"すべてを乗り越え すすみたいんだ",
"JUMP UP",
"僕たちがきずつくのをとめないで",
"JUMP DOWN",
"僕たちがまちがうのをとめないで",
"LET'S JUMP ALL THE BOYS AND GIRLS",
"僕たちが 僕たちが",
"目を閉じて飛ぶのは",
"よりゆたかになり かえってくるため",
"JUMP UP",
"JUMP UP",
"JUMP UP",
"おとうさん さよなら もういくね",
"JUMP DOWN",
"おかあさん ありがとう わすれない",
"LET'S JUMP ALL THE BOYS AND GIRLS",
"見つけよう 見つけよう",
"ちぎれていくこのせかいで",
"動くことのない 自分だけの場所を",
"JUMP UP",
"JUMP UP",
"JUMP UP",
"ALL THE BOYS AND GIRLS",
"JUMP UP",
"ALL THE BOYS AND GIRLS",
"JUMP UP",
"JUMP UP",
"JUMP UP",
"JUMP UP",
"見つけよう",
"ちぎれていく世界で",
"動くことのない 自分だけの場所を",
"さよなら",
"さよなら",
"さよなら もういくね",
"ありがとう",
"ありがとう",
"ありがとう",
"わすれない",
"JUMP UP",
"JUMP UP",
"JUMP UP",
"JUMP UP",
"LET'S JUMP ALL",
"JUMP UP"
];


/* =========================
   音源ファイル
========================= */

/*
  アルトは実際にGitHubへ入れた
  ファイル名をそのまま指定
*/

const files = {

  Alto:
  "Nコン2009「あの空へ_～青のジャンプ～」_Alto[1].m4a",

  /*
    下の3つは、GitHubに入っている
    実際のファイル名と違う場合は
    あとでそこだけ変更できます。
  */

  Soprano:
  "Nコン2009「あの空へ ～青のジャンプ～」 Soprano (1).m4a",

  Tenor:
  "Nコン2009「あの空へ ～青のジャンプ～」 Tenor.m4a",

  Bass:
  "Nコン2009「あの空へ ～青のジャンプ～」 Bass.m4a"
};


/* =========================
   パート名
========================= */

const names = {
  Soprano:"ソプラノ",
  Alto:"アルト",
  Tenor:"テノール",
  Bass:"ベース"
};


/* =========================
   HTML取得
========================= */

const box =
  document.getElementById("lyrics");

const audio =
  document.getElementById("audio");

const menu =
  document.getElementById("menu");

const practice =
  document.getElementById("practice");

const title =
  document.getElementById("title");

const status =
  document.getElementById("status");


/* =========================
   歌詞を表示
========================= */

lyrics.forEach((text,index)=>{

  const line =
    document.createElement("div");

  line.className = "line";

  line.textContent = text;

  line.dataset.i = index;

  box.appendChild(line);

});


/* =========================
   パートボタン
========================= */

document
.querySelectorAll(".part")
.forEach(button=>{

  button.onclick = ()=>{

    const part =
      button.dataset.p;

    title.textContent =
      names[part];

    /* 前の音源を停止 */
    audio.pause();

    audio.removeAttribute("src");

    /* 新しい音源を設定 */
    audio.src =
      files[part];

    audio.load();

    /* 画面切り替え */
    menu.style.display =
      "none";

    practice.style.display =
      "block";

    status.textContent =
      "▶️ 再生ボタンを押してください";

    /* 上に戻す */
    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  };

});


/* =========================
   再生エラー確認
========================= */

audio.addEventListener("error",()=>{

  status.textContent =
    "⚠️ 音源を読み込めませんでした。ファイル名を確認してください。";

});


/* =========================
   再生開始
========================= */

audio.addEventListener("play",()=>{

  status.textContent =
    "🎵 再生中";

});


/* =========================
   一時停止
========================= */

audio.addEventListener("pause",()=>{

  if(audio.currentTime > 0 &&
     !audio.ended){

    status.textContent =
      "⏸️ 一時停止中";

  }

});


/* =========================
   戻る
========================= */

document
.querySelector(".back")
.onclick = ()=>{

  audio.pause();

  audio.removeAttribute("src");

  audio.load();

  practice.style.display =
    "none";

  menu.style.display =
    "block";

};


/* =========================
   歌詞の自動ハイライト
========================= */

audio.addEventListener(
"timeupdate",
()=>{

  const lines =
    document.querySelectorAll(".line");

  if(!audio.duration) return;

  const current =
    Math.floor(
      (audio.currentTime /
      audio.duration) *
      lines.length
    );

  lines.forEach(line=>{
    line.classList.remove("active");
  });

  if(lines[current]){

    lines[current]
      .classList.add("active");

    lines[current]
      .scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

  }

});

</script>

</body>
</html>
```
